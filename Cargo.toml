[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/Victor-root/HomeLumen"
authors = ["The HomeLumen contributors"]

[workspace.dependencies]
homelumen-core = { path = "crates/homelumen-core", version = "0.1.0" }
homelumen-kasa = { path = "crates/homelumen-kasa", version = "0.1.0" }
homelumen-tuya = { path = "crates/homelumen-tuya", version = "0.1.0" }
homelumen-engine = { path = "crates/homelumen-engine", version = "0.1.0" }

aes = "0.8"
async-trait = "0.1"
crc32fast = "1"
dirs = "6"
ecb = "0.1"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
log = "0.4"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = "1"
uuid = { version = "1", features = ["v4"] }

# Dependencies are compiled with optimisations even in a debug build: a GPU
# interface is unusable when its renderer runs unoptimised.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
